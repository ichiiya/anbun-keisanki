<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D5568">
<meta name="color-scheme" content="light">
<title>按分計算機 シンプル版</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#2E3B44;
  --ink-soft:#8B95A0;
  --navy:#3D5568;
  --navy-soft:#5C7A8F;
  --bg:#EDF0F2;
  --card:#FFFFFF;
  --shadow: 6px 6px 14px rgba(163,177,190,0.5), -6px -6px 14px rgba(255,255,255,0.8);
  --shadow-in: inset 3px 3px 8px rgba(163,177,190,0.4), inset -3px -3px 8px rgba(255,255,255,0.7);
  --border: transparent;
}
/* はっきり表示モード */
body.high-contrast{
  --ink:#12181D;
  --ink-soft:#4B545C;
  --navy:#1F3040;
  --navy-soft:#2B4456;
  --shadow: 6px 6px 14px rgba(120,132,144,0.65), -6px -6px 14px rgba(255,255,255,0.95);
  --shadow-in: inset 3px 3px 8px rgba(120,132,144,0.55), inset -3px -3px 8px rgba(255,255,255,0.9);
  --border: rgba(46,59,68,0.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.7;
  transition:background .2s;
}
.wrap{max-width:420px;margin:0 auto;padding:36px 20px 48px;position:relative;}

.top-row{display:flex;justify-content:center;align-items:center;position:relative;margin-bottom:4px;}
h1{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:0;
  color:var(--navy);
}
.settings-btn{
  position:absolute;
  right:0;
  width:38px;height:38px;border-radius:50%;
  background:var(--card);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}
.settings-btn:active{box-shadow:var(--shadow-in);}
.settings-btn svg{width:18px;height:18px;stroke:var(--navy);fill:none;stroke-width:1.8;}

.sub{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 28px;}

.card{
  background:var(--card);
  border-radius:26px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  padding:22px 20px;
  margin-bottom:18px;
}
.card-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--ink-soft);
  font-weight:700;
  margin-bottom:12px;
}
.icon{
  width:26px;height:26px;border-radius:50%;
  background:var(--bg);
  box-shadow:var(--shadow-in);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.icon svg{width:14px;height:14px;stroke:var(--navy);fill:none;stroke-width:2;}

.amount-row{
  display:flex;align-items:baseline;gap:6px;
  background:var(--bg);
  border-radius:16px;
  box-shadow:var(--shadow-in);
  border:1px solid var(--border);
  padding:14px 16px;
}
.amount-row span{color:var(--ink-soft);font-size:16px;}
input[type=number],input[type=text]{
  border:none;background:transparent;
  font-family:inherit;color:var(--ink);
  width:100%;min-width:0;
}
#amount{font-size:26px;font-weight:800;}
input:focus{outline:none;}

.split-tile{
  display:flex;align-items:center;gap:12px;
  background:var(--bg);
  border-radius:18px;
  box-shadow:var(--shadow-in);
  border:1px solid var(--border);
  padding:14px 16px;
  margin-bottom:12px;
}
.split-tile:last-child{margin-bottom:0;}
.split-tile .icon2{
  width:38px;height:38px;border-radius:14px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.split-tile .icon2 svg{width:18px;height:18px;stroke:var(--navy-soft);fill:none;stroke-width:2;}
.split-tile .name-input{flex:1;min-width:0;}
.split-tile .name-input input{font-size:13px;font-weight:700;}
.split-tile .pct-wrap{display:flex;align-items:baseline;gap:2px;flex-shrink:0;width:64px;}
.split-tile .pct-wrap input{text-align:right;font-size:18px;font-weight:800;color:var(--navy);}
.split-tile .pct-wrap span{font-size:11px;color:var(--ink-soft);}

.result-tile{
  border-radius:20px;
  padding:16px 18px;
  margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.result-tile.a{background:var(--card);}
.result-tile.b{background:var(--navy);border-color:transparent;}
.result-tile.b .r-name,.result-tile.b .r-pct{color:#C9D6DE;}
.result-tile.b .r-amt{color:#fff;}
.r-name{font-size:12px;font-weight:700;}
.r-pct{font-size:11px;color:var(--ink-soft);}
.r-amt{font-size:21px;font-weight:800;}
.r-amt .u{font-size:11px;font-weight:500;margin-left:2px;}

button.ctrl{
  width:100%;padding:14px;
  border:1px solid var(--border);border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
  color:var(--navy);font-weight:700;font-size:13px;
  font-family:inherit;
}
button.ctrl:active{box-shadow:var(--shadow-in);}
.saved{font-size:11px;color:var(--ink-soft);text-align:center;height:16px;margin-top:10px;}
footer{margin-top:28px;font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.8;}

/* 見やすさ設定パネル */
.overlay{
  position:fixed;inset:0;background:rgba(46,59,68,0.35);
  display:none;align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.open{display:flex;}
.panel{
  width:100%;max-width:420px;
  background:var(--bg);
  border-radius:24px 24px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(46,59,68,0.25);
}
.panel h2{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 4px;}
.panel .desc{font-size:12px;color:var(--ink-soft);margin:0 0 18px;}
.mode-row{display:flex;gap:10px;margin-bottom:8px;}
.mode-btn{
  flex:1;padding:14px 8px;border-radius:16px;
  background:var(--card);box-shadow:var(--shadow-in);border:1px solid var(--border);
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
  text-align:center;
}
.mode-btn.active{background:var(--navy);color:#fff;box-shadow:var(--shadow);border-color:transparent;}
.panel-close{
  width:100%;margin-top:14px;padding:13px;border-radius:16px;
  background:transparent;border:none;color:var(--ink-soft);font-family:inherit;font-size:12.5px;
}
</style>
</head>
<body>
<div class="wrap">

<div class="top-row">
  <h1>按分計算機</h1>
  <button type="button" class="settings-btn" id="openSettings" aria-label="見やすさ設定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
  </button>
</div>
<p class="sub">確定申告の経費按分をかんたんに</p>

<div class="card">
  <div class="card-label">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></span>
    金額
  </div>
  <div class="amount-row">
    <span>¥</span>
    <input type="number" id="amount" inputmode="numeric" placeholder="0" step="1">
  </div>
</div>

<div class="card">
  <div class="card-label">
    <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg></span>
    按分の設定
  </div>
  <div class="split-tile">
    <span class="icon2"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></span>
    <span class="name-input"><input type="text" id="label1" value="事業用"></span>
    <span class="pct-wrap"><input type="number" id="rate1" value="50" min="0" max="100"><span>%</span></span>
  </div>
  <div class="split-tile">
    <span class="icon2"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10z"/></svg></span>
    <span class="name-input"><input type="text" id="label2" value="プライベート"></span>
    <span class="pct-wrap"><input type="number" id="rate2" value="50" min="0" max="100"><span>%</span></span>
  </div>
</div>

<div class="card">
  <div class="card-label">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 19h16M4 15l4-4 4 3 6-7"/></svg></span>
    計算結果
  </div>
  <div class="result-tile a">
    <div><div class="r-name" id="r1name">事業用</div><div class="r-pct" id="r1pct">50%</div></div>
    <div class="r-amt"><span id="r1amt">0</span><span class="u">円</span></div>
  </div>
  <div class="result-tile b">
    <div><div class="r-name" id="r2name">プライベート</div><div class="r-pct" id="r2pct">50%</div></div>
    <div class="r-amt"><span id="r2amt">0</span><span class="u">円</span></div>
  </div>
</div>

<button type="button" class="ctrl" id="reset">クリア</button>
<div class="saved" id="savedMsg"></div>
<footer>個人で作ったツールです。予告なく公開を終了したり、内容を変更したりする場合があります。計算結果はご自身でご確認ください。入力内容はこの端末に自動で保存されます。</footer>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>見やすさ設定</h2>
    <p class="desc">コントラストの強さを選べます。設定はこの端末に保存されます。</p>
    <div class="mode-row">
      <button type="button" class="mode-btn" id="modeStandard">標準</button>
      <button type="button" class="mode-btn" id="modeHigh">はっきり表示</button>
    </div>
    <button type="button" class="panel-close" id="closeSettings">閉じる</button>
  </div>
</div>

<script>
"use strict";
var KEYS = ["amount","label1","label2","rate1","rate2"];
var STORE = "anbun-simple-v4";
var MODE_STORE = "anbun-simple-contrast";
var saveTimer = null;

function el(id){ return document.getElementById(id); }
function num(id){ var v = parseFloat(el(id).value); return isFinite(v) ? v : 0; }
function yen(n){ return Math.round(n).toLocaleString("ja-JP"); }
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function load(){
  try {
    var raw = localStorage.getItem(STORE);
    if(raw){
      var saved = JSON.parse(raw);
      KEYS.forEach(function(k){ if(saved[k] !== undefined) el(k).value = saved[k]; });
    }
  } catch(e){}
}
function scheduleAutoSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var o = {};
    KEYS.forEach(function(k){ o[k] = el(k).value; });
    try { localStorage.setItem(STORE, JSON.stringify(o)); } catch(e){}
  }, 400);
}

function onRateInput(which){
  if(which === 1){
    var v = clamp(num("rate1"));
    el("rate1").value = v;
    el("rate2").value = 100 - v;
  } else {
    var v2 = clamp(num("rate2"));
    el("rate2").value = v2;
    el("rate1").value = 100 - v2;
  }
  render();
}

function render(){
  var amount = num("amount");
  var r1 = num("rate1");
  var r2 = num("rate2");
  var l1 = el("label1").value || "項目A";
  var l2 = el("label2").value || "項目B";

  el("r1name").textContent = l1;
  el("r2name").textContent = l2;
  el("r1pct").textContent = r1 + "%";
  el("r2pct").textContent = r2 + "%";
  el("r1amt").textContent = yen(amount * r1 / 100);
  el("r2amt").textContent = yen(amount * r2 / 100);

  scheduleAutoSave();
}

el("amount").addEventListener("input", render);
el("label1").addEventListener("input", render);
el("label2").addEventListener("input", render);
el("rate1").addEventListener("input", function(){ onRateInput(1); });
el("rate2").addEventListener("input", function(){ onRateInput(2); });

el("reset").addEventListener("click", function(){
  el("amount").value = "";
  el("label1").value = "事業用";
  el("label2").value = "プライベート";
  el("rate1").value = "50";
  el("rate2").value = "50";
  try { localStorage.removeItem(STORE); } catch(e){}
  render();
});

/* 見やすさ設定 */
function applyContrastMode(mode){
  document.body.classList.toggle("high-contrast", mode === "high");
  el("modeStandard").classList.toggle("active", mode !== "high");
  el("modeHigh").classList.toggle("active", mode === "high");
  try { localStorage.setItem(MODE_STORE, mode); } catch(e){}
}
function loadContrastMode(){
  var mode = "standard";
  try { mode = localStorage.getItem(MODE_STORE) || "standard"; } catch(e){}
  applyContrastMode(mode);
}
el("openSettings").addEventListener("click", function(){ el("overlay").classList.add("open"); });
el("closeSettings").addEventListener("click", function(){ el("overlay").classList.remove("open"); });
el("overlay").addEventListener("click", function(e){ if(e.target === el("overlay")) el("overlay").classList.remove("open"); });
el("modeStandard").addEventListener("click", function(){ applyContrastMode("standard"); });
el("modeHigh").addEventListener("click", function(){ applyContrastMode("high"); });

load();
loadContrastMode();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
